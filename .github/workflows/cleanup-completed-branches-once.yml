name: One-time branch cleanup (-KR-The-Midnight-Ride)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-completed-branches-once.yml'
permissions:
  contents: write
jobs:
  clean:
    if: github.repository == 'munument1/-KR-The-Midnight-Ride'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const targets=[{"name":"show-upstream-changelog-below-kr","sha":"37ab857dc93532b4252bd19d67fd910a84c82d76","pr":3},{"name":"sidebar-upstream-changelog-20261019","sha":"a200a68e81c63a6882e3637e444a47e1316921b2","pr":4},{"name":"sync-upstream-2026-10-18-ko","sha":"a980a69f12292f54ab68d595a9f10f38bdc3179a","pr":1},{"name":"translate-changelog-from-2026-10-18","sha":"d9a9ac25f70501c3132835040543599c4c9af6c3","pr":2}];
            if(context.repo.owner!=='munument1'||context.repo.repo!=="-KR-The-Midnight-Ride"||context.ref!=='refs/heads/main')throw Error('Wrong repository/ref');
            const owner=context.repo.owner,repo=context.repo.repo;
            const prs=await github.paginate(github.rest.pulls.list,{owner,repo,state:'open',per_page:100});
            const blocked=new Set(prs.flatMap(p=>[p.head.ref,p.base.ref]));
            let deleted=0;const skipped=[];
            for(const c of targets){
             if(blocked.has(c.name)||c.name==='main'||c.name==='gh-pages'){skipped.push(c.name+': protected');continue;}
             const b=(await github.rest.repos.getBranch({owner,repo,branch:c.name})).data;
             const p=(await github.rest.pulls.get({owner,repo,pull_number:c.pr})).data;
             if(b.protected||b.commit.sha!==c.sha||!p.merged_at||p.base.ref!=='main'||p.head.ref!==c.name||p.head.sha!==c.sha){skipped.push(c.name+': changed');continue;}
             await github.rest.git.deleteRef({owner,repo,ref:'heads/'+c.name});deleted++;core.info('DELETED '+c.name);
            }
            for(const x of skipped)core.warning('SKIPPED '+x);
            core.info('Finished cleanup: '+deleted+' deleted of '+targets.length+' planned');
